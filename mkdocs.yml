site_name: Fraud Streaming Pipeline
site_description: Pipeline de detecção de fraude com Kafka, Spark, dbt e Isolation Forest
site_url: https://lal3x.github.io/fraud-streaming-pipeline/
repo_url: https://github.com/Lal3x/fraud-streaming-pipeline
repo_name: Lal3x/fraud-streaming-pipeline
edit_uri: edit/dev/docs/
theme:
  name: material
  language: pt-BR
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Usar tema claro

nav:
  - Início: index.md
  - Sobre o projeto: project.md
  - Arquitetura: architecture.md
  - Fluxo de dados: data-flow.md
  - Modelo de dados: data-model.md
  - Executar localmente: getting-started.md
  - Roteiro de demonstração: demo.md
  - Pipeline:
      - Camada Silver: silver.md
      - Orquestração com Airflow: airflow.md
      - Machine Learning: machine-learning.md
  - Visualização: observability.md
  - Qualidade e testes: quality.md
  - Configuração: configuration.md
  - Resultados e aprendizados: results.md
  - Decisões técnicas: decisions.md
  - Desenvolvimento: development.md
  - Solução de problemas: troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: pt

strict: true
