name: CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.4.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configurar Java para o Spark
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Restaurar ambiente virtual
        uses: actions/cache@v5
        with:
          path: .venv
          key: poetry-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Instalar dependências
        run: poetry install --with dev --no-interaction

      - name: Verificar lint e formatação
        run: poetry run task lint

      - name: Executar testes unitários e Spark
        run: poetry run task tests

      - name: Publicar relatório de cobertura
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  documentation:
    name: Documentação
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Restaurar ambiente virtual
        uses: actions/cache@v5
        with:
          path: .venv
          key: poetry-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Instalar dependências
        run: poetry install --with dev --no-interaction

      - name: Construir MkDocs em modo estrito
        run: poetry run mkdocs build --strict

      - name: Configurar GitHub Pages
        if: |
          github.ref == 'refs/heads/main' &&
          github.event.repository.visibility == 'public' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@v5

      - name: Preparar artefato do GitHub Pages
        if: |
          github.ref == 'refs/heads/main' &&
          github.event.repository.visibility == 'public' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    name: Publicar documentação
    if: |
      github.ref == 'refs/heads/main' &&
      github.event.repository.visibility == 'public' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
