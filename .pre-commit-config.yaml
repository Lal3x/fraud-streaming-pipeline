# Hooks locais reutilizam as versões fixadas pelo Poetry.
# Instalação: poetry run pre-commit install --hook-type pre-commit --hook-type pre-push
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-fix
        name: Corrigir erros seguros com Ruff
        entry: poetry run ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]
        require_serial: true

      - id: ruff-format
        name: Formatar código com Ruff
        entry: poetry run ruff format
        language: system
        types: [python]
        stages: [pre-commit]
        require_serial: true

      - id: black
        name: Padronizar código com Black
        entry: poetry run black --workers 1
        language: system
        types: [python]
        stages: [pre-commit]
        require_serial: true

      - id: ruff-check
        name: Verificação final com Ruff
        entry: poetry run ruff check
        language: system
        types: [python]
        stages: [pre-commit]
        require_serial: true

      - id: unit-tests
        name: Executar testes unitários antes do push
        entry: poetry run pytest tests/unit -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
