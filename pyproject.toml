[project]
name = "fraud-streaming-pipeline"
version = "0.1.0"
description = "End-to-end streaming data platform for fraud analytics"
authors = [
    {name = "Lucas Alexandre", email = "174282100+Lal3x@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka (>=2.15.0,<3.0.0)",
    "pyspark (==4.1.2)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "orjson (>=3.12.0,<4.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "prometheus-client (>=0.26.0,<0.27.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "pyarrow (>=25.0.1,<26.0.0)",
    "streamlit (>=1.49.0,<2.0.0)",
    "plotly (>=6.0.0,<7.0.0)",
    "pandas (>=2.2.0,<3.0.0)"
]

[tool.poetry]
packages = [{include = "fraud_streaming_pipeline", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=25.1.0,<26.0.0)",
    "mkdocs-material (>=9.6,<10.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "ruff (>=0.16.5,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.taskipy.tasks]
lint = "ruff check --select I . && ruff format --check . && black --check ."
format = "ruff format . && ruff check --select I --fix . && black ."
tests = "pytest tests -v --cov=fraud_streaming_pipeline --cov-report=term-missing --cov-report=xml --cov-fail-under=70"

[tool.black]
target-version = ["py312"]
workers = 1
extend-exclude = '''
/(
    \.venv
  | venv
  | env
  | data
  | site
  | logs
  | target
  | dbt_packages
  | infrastructure/airflow/logs
)/
'''

[tool.coverage.run]
omit = [
    # Pontos de entrada visuais/contínuos são validados por smoke tests do ambiente.
    "src/fraud_streaming_pipeline/dashboard/app.py",
    "src/fraud_streaming_pipeline/etl/bronze/job.py",
    "src/fraud_streaming_pipeline/etl/silver/job.py",
]
