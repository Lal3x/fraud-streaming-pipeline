name: fraud-streaming

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: fraud-kafka
    hostname: kafka
    restart: unless-stopped
    mem_limit: 768m

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"

      KAFKA_LISTENERS: "CONTROLLER://:29093,INTERNAL://:29092,EXTERNAL://:9092"

      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"

      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - streaming_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.1.0
    container_name: fraud-kafka-init
    restart: "no"

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - streaming_network

    entrypoint:
      - /bin/bash
      - -c

    command:
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic fraud-transactions-raw \
          --partitions 3 \
          --replication-factor 1

        echo "Topic fraud-transactions-raw is ready"

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    container_name: fraud-kafbat-ui
    restart: unless-stopped
    mem_limit: 384m

    depends_on:
      kafka:
        condition: service_healthy

    ports:
      - "8082:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: fraud-streaming
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

    networks:
      - streaming_network

  minio:
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: fraud-minio
    hostname: minio
    restart: unless-stopped
    mem_limit: 512m

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    env_file:
      - ../../.env

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - streaming_network

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: fraud-minio-init
    restart: "no"

    depends_on:
      minio:
        condition: service_started

    env_file:
      - ../../.env

    entrypoint:
      - /bin/sh
      - -c

    command:
      - >-
        until mc alias set local http://minio:9000
        "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        do sleep 1; done;
        mc mb --ignore-existing "local/$$MINIO_BUCKET"

    networks:
      - streaming_network

  spark-master:
    image: spark:4.1.2-scala2.13-java17-python3-ubuntu
    container_name: fraud-spark-master
    hostname: spark-master
    restart: unless-stopped
    mem_limit: 512m

    ports:
      - "7077:7077"
      - "8080:8080"

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"

    volumes:
      - ../../src:/opt/spark/project/src:ro
      - ../../data:/opt/spark/project/data
      - spark_checkpoints:/opt/spark/project/checkpoints

    networks:
      - streaming_network

  spark-worker:
    image: spark:4.1.2-scala2.13-java17-python3-ubuntu
    container_name: fraud-spark-worker
    hostname: spark-worker
    restart: unless-stopped
    mem_limit: 1400m

    depends_on:
      - spark-master

    ports:
      - "8081:8081"

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "2"
      - --memory
      - "1g"
      - --webui-port
      - "8081"
      - spark://spark-master:7077

    volumes:
      - ../../src:/opt/spark/project/src:ro
      - ../../data:/opt/spark/project/data
      - spark_checkpoints:/opt/spark/project/checkpoints

    networks:
      - streaming_network

  spark-storage-init:
    image: spark:4.1.2-scala2.13-java17-python3-ubuntu
    container_name: fraud-spark-storage-init
    user: "0:0"
    restart: "no"

    command:
      - /bin/sh
      - -c
      - >-
        mkdir -p
        /opt/spark/project/checkpoints/bronze-paysim-events-v3
        /opt/spark/project/checkpoints/silver-transactions-v1
        /opt/spark/project/checkpoints/silver-invalid-events-v1
        /opt/spark/project/checkpoints/silver-fraud-alerts-v1
        /tmp/.ivy2
        && chmod 0777
        /opt/spark/project/checkpoints/bronze-paysim-events-v3
        /opt/spark/project/checkpoints/silver-transactions-v1
        /opt/spark/project/checkpoints/silver-invalid-events-v1
        /opt/spark/project/checkpoints/silver-fraud-alerts-v1
        /tmp/.ivy2

    volumes:
      - spark_checkpoints:/opt/spark/project/checkpoints
      - spark_ivy:/tmp/.ivy2

    networks:
      - streaming_network

  bronze-stream:
    image: spark:4.1.2-scala2.13-java17-python3-ubuntu
    container_name: fraud-bronze-stream
    hostname: bronze-stream
    restart: unless-stopped
    mem_limit: 900m

    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      spark-storage-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --total-executor-cores
      - "1"
      - --executor-memory
      - 512m
      - --conf
      - spark.driver.host=bronze-stream
      - --conf
      - spark.driver.memory=512m
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.2,org.apache.hadoop:hadoop-aws:3.4.2
      - /opt/spark/project/src/fraud_streaming_pipeline/etl/bronze/job.py

    env_file:
      - ../../.env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: fraud-transactions-raw
      MINIO_ENDPOINT: http://minio:9000
      BRONZE_OUTPUT_PATH: s3a://${MINIO_BUCKET:-fraud-data-lake}/bronze/paysim/events
      BRONZE_CHECKPOINT_PATH: /opt/spark/project/checkpoints/bronze-paysim-events-v3

    volumes:
      - ../../src:/opt/spark/project/src:ro
      - ../../data:/opt/spark/project/data
      - spark_checkpoints:/opt/spark/project/checkpoints
      - spark_ivy:/tmp/.ivy2

    networks:
      - streaming_network

  silver-stream:
    image: spark:4.1.2-scala2.13-java17-python3-ubuntu
    container_name: fraud-silver-stream
    hostname: silver-stream
    restart: unless-stopped
    mem_limit: 1g

    depends_on:
      spark-master:
        condition: service_started
      spark-worker:
        condition: service_started
      spark-storage-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      bronze-stream:
        condition: service_started

    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --total-executor-cores
      - "1"
      - --executor-memory
      - 512m
      - --conf
      - spark.driver.host=silver-stream
      - --conf
      - spark.driver.memory=640m
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - --conf
      - spark.sql.shuffle.partitions=3
      - --packages
      - org.apache.hadoop:hadoop-aws:3.4.2
      - /opt/spark/project/src/fraud_streaming_pipeline/etl/silver/job.py

    env_file:
      - ../../.env

    environment:
      MINIO_ENDPOINT: http://minio:9000
      PYTHONPATH: /opt/spark/project/src

    volumes:
      - ../../src:/opt/spark/project/src:ro
      - spark_checkpoints:/opt/spark/project/checkpoints
      - spark_ivy:/tmp/.ivy2

    networks:
      - streaming_network

volumes:
  kafka_data:
    name: fraud-kafka-data

  spark_checkpoints:
    name: fraud-spark-checkpoints

  minio_data:
    name: fraud-minio-data

  spark_ivy:
    name: fraud-spark-ivy

networks:
  streaming_network:
    name: fraud-streaming-network
    driver: bridge
