name: fraud-airflow

x-airflow-common: &airflow-common
  image: fraud-airflow:local
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ../../.env
  environment: &airflow-common-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET is required}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    PAYSIM_FILE: /opt/airflow/project/data/raw/paysim.csv
    PRODUCER_CHECKPOINT: /opt/airflow/project/data/checkpoints/producer.json
    PYTHONPATH: /opt/airflow/project/src
  user: "${AIRFLOW_UID:-50000}:0"
  group_add:
    - "${DOCKER_GID:-999}"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ../../src:/opt/airflow/project/src:ro
    - ../../config:/opt/airflow/project/config:ro
    - ../../data:/opt/airflow/project/data
    - /var/run/docker.sock:/var/run/docker.sock
  networks:
    - airflow_network
    - streaming_network

services:
  postgres:
    image: postgres:16-alpine
    container_name: fraud-airflow-postgres
    hostname: postgres
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: airflow
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - airflow_network

  airflow-permissions:
    <<: *airflow-common
    container_name: fraud-airflow-permissions
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        mkdir -p /opt/airflow/dags /opt/airflow/logs /opt/airflow/plugins
        /opt/airflow/project/data/checkpoints
        && chmod -R a+rwX
        /opt/airflow/dags /opt/airflow/logs /opt/airflow/plugins
        /opt/airflow/project/data/checkpoints
    restart: "no"

  airflow-init:
    <<: *airflow-common
    container_name: fraud-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
      airflow-permissions:
        condition: service_completed_successfully
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname "$${AIRFLOW_ADMIN_FIRSTNAME}" \
          --lastname "$${AIRFLOW_ADMIN_LASTNAME}" \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_EMAIL}" || true
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    container_name: fraud-airflow-api-server
    restart: unless-stopped
    mem_limit: 768m
    command: api-server
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_PORT:-8083}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail http://localhost:8080/api/v2/monitor/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    container_name: fraud-airflow-scheduler
    restart: unless-stopped
    mem_limit: 768m
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type SchedulerJob --hostname '$${HOSTNAME}'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    container_name: fraud-airflow-dag-processor
    restart: unless-stopped
    mem_limit: 512m
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type DagProcessorJob --hostname '$${HOSTNAME}'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-triggerer:
    <<: *airflow-common
    container_name: fraud-airflow-triggerer
    restart: unless-stopped
    mem_limit: 512m
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type TriggererJob --hostname '$${HOSTNAME}'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  airflow_postgres_data:
    name: fraud-airflow-postgres-data

networks:
  airflow_network:
    name: fraud-airflow-network
    driver: bridge
  streaming_network:
    name: fraud-streaming-network
    external: true
